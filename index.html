<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Investasi Modern</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e3a8a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%2360a5fa'%3E%24%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>💎 Kalkulator Investasi</h1>
        <p class="subtitle">Simulasikan pertumbuhan investasimu dengan mudah</p>

        <div class="input-section">
            <div class="input-group">
                <label for="current_money">💰 Uang Tersedia Saat Ini (Rp)</label>
                <input type="text" inputmode="numeric" id="current_money" value="0" placeholder="Masukkan jumlah uang tersedia">
                <span class="error-msg" id="err_current_money"></span>
            </div>

            <div class="input-group">
                <label for="investment_amount">📈 Jumlah Investasi per Periode (Rp)</label>
                <input type="text" inputmode="numeric" id="investment_amount" value="0" placeholder="Masukkan jumlah investasi">
                <span class="error-msg" id="err_investment_amount"></span>
            </div>

            <div class="input-group">
                <label for="investment_frequency">🔄 Frekuensi Investasi</label>
                <select id="investment_frequency">
                    <option value="once">Sekali (di awal saja)</option>
                    <option value="daily">Setiap Hari</option>
                    <option value="weekly">Mingguan</option>
                    <option value="monthly" selected>Bulanan</option>
                    <option value="quarterly">Tiga Bulanan</option>
                    <option value="semiannually">Enam Bulanan</option>
                    <option value="annually">Tahunan</option>
                </select>
            </div>

            <div class="input-group">
                <label for="investment_period">⏰ Jangka Waktu (Tahun)</label>
                <input type="number" id="investment_period" value="1" min="1" max="50" placeholder="Masukkan jangka waktu">
                <span class="error-msg" id="err_investment_period"></span>
            </div>

            <div class="input-group">
                <label for="annual_interest">💹 Bunga / Imbal Hasil Tahunan (%)</label>
                <input type="number" id="annual_interest" value="5" min="0" max="1000" step="0.1" placeholder="Masukkan tingkat bunga">
                <span class="error-msg" id="err_annual_interest"></span>
            </div>

            <button id="calculate_button">
                🚀 Hitung Investasi
            </button>

            <div class="results" id="results_section">
                <h2>📊 Hasil Investasi</h2>
                <p>Total Modal Disetor: <span id="total_investment">Rp 0</span></p>
                <p>Total Bunga/Keuntungan: <span id="total_interest">Rp 0</span></p>
                <p>Total Akhir: <span id="final_amount">Rp 0</span></p>
                <div class="percentage-highlight">
                    <p style="margin: 0;">Pertumbuhan: <span id="percentage_difference">0%</span></p>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-container">
                <canvas id="investmentChart"></canvas>
            </div>
        </div>

        <p class="footer-note">Dibuat untuk Hepi · Simulasi ini bersifat estimasi, bukan jaminan hasil investasi.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
